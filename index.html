<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DevOps Wisdom · Random Quote</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* UNSCROLLABLE PAGE — strict no scrolling */
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #eef2f3;
            /* light grey background */
        }

        body {
            display: grid;
            grid-template-rows: 1fr auto;
            /* main content takes free space, footer auto */
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: #eef2f3;
            line-height: 1.4;
        }

        /* ----- CENTERED QUOTE CONTAINER (flex inside grid row) ----- */
        .quote-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            /* fills the 1fr row */
        }

        .quote-card {
            max-width: 860px;
            width: 86%;
            margin: 1rem;
            padding: 1.5rem 2rem;
            text-align: center;
            background-color: transparent;
            /* fully transparent — inherits light grey */
            border-radius: 2rem;
            transition: all 0.2s ease;
        }

        /* quote text — darker grey */
        .quote-text {
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #2d2f31;
            /* deep dark grey */
            margin-bottom: 1.8rem;
            line-height: 1.35;
            quotes: "“" "”" "‘" "’";
        }

        .quote-text::before {
            content: "“";
            font-size: 1.2em;
            font-weight: 400;
            color: #3a4a4f;
            margin-right: 0.1rem;
        }

        .quote-text::after {
            content: "”";
            font-size: 1.2em;
            font-weight: 400;
            color: #3a4a4f;
            margin-left: 0.1rem;
        }

        /* author line — darker grey, elegant */
        .quote-author {
            font-size: clamp(1.1rem, 4vw, 1.45rem);
            color: #2f3e44;
            font-weight: 450;
            letter-spacing: 0.01em;
            border-top: 1px solid #cddbdf;
            display: inline-block;
            padding-top: 1rem;
            padding-left: 1.2rem;
            padding-right: 1.2rem;
        }

        /* optional subtle em dash */
        .quote-author::before {
            content: "— ";
            font-weight: 400;
            letter-spacing: -0.5px;
            opacity: 0.8;
        }

        /* ----- FOOTER (sticky bottom, no scrolling) ----- */
        .app-footer {
            text-align: center;
            padding: 1rem 1.2rem;
            font-size: 0.85rem;
            color: #4a5b62;
            background-color: #e2e9ec;
            /* subtly deeper grey for footer contrast, still light */
            letter-spacing: 0.3px;
            border-top: 1px solid #cfdfe4;
            font-weight: 400;
            width: 100%;
        }

        /* responsiveness: maintain perfect centering on very small devices */
        @media (max-width: 580px) {
            .quote-card {
                width: 92%;
                padding: 1rem 1.2rem;
            }

            .quote-text {
                margin-bottom: 1.2rem;
            }

            .quote-author {
                padding-top: 0.8rem;
            }
        }

        /* prevent any accidental scroll or margin overflow */
        body,
        div,
        footer {
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Main content: centered quote + author -->
    <div class="quote-stage">
        <div class="quote-card">
            <div class="quote-text" id="dynamicQuote">— loading DevOps wisdom —</div>
            <div class="quote-author" id="dynamicAuthor">...</div>
        </div>
    </div>

    <!-- Footer with required copyright -->
    <footer class="app-footer">
        © 2026 3MTT x DHF Demo
    </footer>

    <script>
        (function () {
            //now 21 hand-picked DevOps quotes (realistic & inspiring)
            // and 21 matching authors (separate arrays)
            const devopsQuotes = [
                "You build it, you run it.",
                "Infrastructure as Code is not just a practice, it’s a mindset for modern operations.",
                "DevOps is the cultural movement that breaks down silos between development and operations.",
                "The goal of continuous delivery: make deployments boring, reliable, and fast.",
                "Without blameless post-mortems, you never truly learn from failure.",
                "High-trust, collaborative teams are the engine of DevOps transformation.",
                "Measuring lead time and deployment frequency reveals your true delivery capability.",
                "Automate the mundane, so humans can focus on creative problem solving.",
                "Fail fast, learn faster, and always design for recoverability.",
                "DevOps combines culture, automation, measurement, and sharing — CAMS.",
                "Store everything in version control: application code, pipeline config, and infrastructure.",
                "Security is not a phase at the end; it’s a built-in part of the pipeline — DevSecOps.",
                "Breaking down Dev and Ops walls creates better outcomes for users and businesses.",
                "Observability gives you the power to ask unexpected questions about production systems.",
                "Deployments should be low-risk, frequent, and easily reversible.",
                "‘Done’ means running in production, not just merging a pull request.",
                "Without metrics and monitoring, you are flying blind in the cloud.",
                "Treat your infrastructure like application code: with tests, reviews, and design patterns.",
                "Culture eats strategy for breakfast — and that doubles for DevOps.",
                "Resilience and adaptability matter more than rigid compliance.",
                "Don't take a snapshot of bad code."
            ];

            const authorsList = [
                "Werner Vogels",
                "Kief Morris",
                "Patrick Debois",
                "Jez Humble",
                "John Allspaw",
                "Nicole Forsgren",
                "DORA Research Team",
                "Mik Kersten",
                "John Willis",
                "Gene Kim",
                "Bridget Kromhout",
                "Shannon Lietz",
                "Damon Edwards",
                "Charity Majors",
                "David Farley",
                "Andrew Clay Shafer",
                "Jez Humble & Nicole Forsgren",
                "Kelsey Hightower",
                "Patrick Debois",
                "Jeffrey Snover",
                "Olufemi Akinboye"
            ];

            // safety: ensure both arrays have exactly 21 items
            // (they already do, but we validate for robustness)
            // there's probably a better way to go about this but I can't write javascript to save my life so I'm changing 20 to 21.
            if (devopsQuotes.length !== 21 || authorsList.length !== 21) {
                console.warn("Quote/author arrays length mismatch. Adjusting to 20 items.");
                // fallback: extend or trim if needed, but not required for final
                while (devopsQuotes.length < 21) devopsQuotes.push("DevOps bridges people and automation.");
                while (authorsList.length < 21) authorsList.push("DevOps Community");
            }

            // helper: random integer between 1 and 20 (both inclusive)
            function getRandomIndex() {
                return Math.floor(Math.random() * 21) + 1;   // returns 1 .. 20
            }

            // select quote + author based on random number
            function updateQuoteAndAuthor() {
                const randomNum = getRandomIndex();       // 1..20
                const idx = randomNum - 1;                // zero-based array index

                const selectedQuote = devopsQuotes[idx];
                const selectedAuthor = authorsList[idx];

                // get DOM elements
                const quoteElement = document.getElementById("dynamicQuote");
                const authorElement = document.getElementById("dynamicAuthor");

                if (quoteElement && authorElement) {
                    // remove any placeholder content
                    quoteElement.textContent = selectedQuote;
                    // author element will have the pseudo-element for dash, we set clean text
                    authorElement.textContent = selectedAuthor;
                } else {
                    // fallback in case of unexpected dom timing
                    if (quoteElement) quoteElement.textContent = selectedQuote;
                    if (authorElement) authorElement.textContent = selectedAuthor;
                }
            }

            // execute on page load (DOM fully loaded, guarantees elements exist)
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", updateQuoteAndAuthor);
            } else {
                // DOM already ready (async edge case)
                updateQuoteAndAuthor();
            }
        })();
    </script>
</body>

</html>
